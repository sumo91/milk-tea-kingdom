[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Docs, tests, editor-only flight deck, and unwired art stay on disk but out of the pack.
; Keep runtime_probe + scenario_runner (autoload). Portrait skin, bars, three station icons, CJK font, data JSON stay.
exclude_filter="docs/*,tests/*,tools/*,*.md,*.txt,data/v0_balance_draft.json,assets/ui/idle/main/UI_PANEL_MAIN_temp.png,assets/ui/idle/icons/UI_ICON_STATION_SEAL_temp.png,assets/ui/idle/upgrade/*,assets/ui/idle/offline/*,addons/flight_deck/editor_bridge.gd,addons/flight_deck/plugin.gd,addons/flight_deck/plugin.cfg,addons/flight_deck/visual_diff.gd,addons/flight_deck/unit_runner.gd,addons/flight_deck/test_case.gd,scripts/smoke_v0.gd,web/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
; Imports are Lossless (compress/mode=0, vram_texture=false), so these flags do not add
; S3TC/ETC2 today. Both true on one Web pck would embed two GPU copies after a VRAM reimport.
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.98, 0.96, 0.93, 1)
