<!DOCTYPE html>
<html lang="zh-Hans">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>奶茶王国放置</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #4A3728;
	background-color: #242424;
	overflow: hidden;
	touch-action: none;
	font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", "Heiti SC", "WenQuanYi Micro Hei", sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	z-index: 2;
	display: flex;
	flex-direction: column;
	justify-content: flex-end;
	align-items: center;
	background-color: #242424;
	visibility: visible;
}

#status-splash {
	position: absolute;
	top: 10vh;
	left: 0;
	right: 0;
	width: min(240px, 52vw);
	height: auto;
	max-height: 28vh;
	margin: 0 auto;
	object-fit: contain;
	pointer-events: none;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#boot {
	position: relative;
	z-index: 3;
	width: min(420px, calc(100% - 32px));
	margin: 0 16px max(28px, env(safe-area-inset-bottom));
	padding: 16px 18px 14px;
	background: #FFF3E8;
	color: #4A3728;
	border-radius: 16px;
	box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
}

#boot-label {
	margin: 0 0 10px;
	font-size: 22px;
	font-weight: 600;
	line-height: 1.3;
	letter-spacing: 0.02em;
}

#boot-track {
	height: 12px;
	background: #E8DFD4;
	border-radius: 999px;
	overflow: hidden;
}

#boot-fill {
	height: 100%;
	width: 0%;
	background: #3D9B4A;
	border-radius: 999px;
}

#boot-fill.is-busy {
	width: 100%;
	background-image: linear-gradient(90deg, #3D9B4A 0%, #8FD99A 50%, #3D9B4A 100%);
	background-size: 200% 100%;
	animation: boot-slide 1.1s linear infinite;
}

@keyframes boot-slide {
	from { background-position: 100% 0; }
	to { background-position: -100% 0; }
}

#boot-detail {
	margin: 8px 0 0;
	font-size: 15px;
	line-height: 1.3;
	color: #7A6554;
}

#status-notice {
	display: none;
	position: relative;
	z-index: 3;
	width: min(420px, calc(100% - 32px));
	margin: 0 16px 16px;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	padding: 1rem;
	text-align: center;
}
		</style>
				<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<noscript>需要开启 JavaScript 才能进入奶茶王国。</noscript>
		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<div id="boot">
				<p id="boot-label">下载资源… 0%</p>
				<div id="boot-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="下载资源…">
					<div id="boot-fill"></div>
				</div>
				<p id="boot-detail">0.0 MB</p>
			</div>
			<div id="status-notice"></div>
		</div>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":997092,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

function bootLabelText(phase, current, total) {
	if (phase === 'load') {
		return '加载游戏…';
	}
	if (phase === 'ready') {
		return '马上好…';
	}
	if (!(total > 0)) {
		return '下载资源…';
	}
	var pct = Math.floor((current / total) * 100);
	if (pct < 0) {
		pct = 0;
	}
	if (current < total && pct > 99) {
		pct = 99;
	}
	if (pct > 100) {
		pct = 100;
	}
	return '下载资源… ' + pct + '%';
}

function bootDetailText(current, total) {
	function mb(n) {
		return (n / 1048576).toFixed(1);
	}
	if (total > 0) {
		var shown = current > total ? total : current;
		return mb(shown) + ' / ' + mb(total) + ' MB';
	}
	if (current > 0) {
		return mb(current) + ' MB';
	}
	return '0.0 MB';
}

function knownTotalBytes() {
	var sizes = GODOT_CONFIG.fileSizes || {};
	var sum = 0;
	Object.keys(sizes).forEach(function (key) {
		sum += Number(sizes[key]) || 0;
	});
	return sum;
}

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const boot = document.getElementById('boot');
	const bootLabel = document.getElementById('boot-label');
	const bootFill = document.getElementById('boot-fill');
	const bootTrack = document.getElementById('boot-track');
	const bootDetail = document.getElementById('boot-detail');

	let initializing = true;

	let bootPhase = 'download';

	function paintBoot(phase, current, total) {
		var label = bootLabelText(phase, current, total);
		var pct = 0;
		if (total > 0) {
			pct = Math.floor((Math.min(current, total) / total) * 100);
		}
		if (phase === 'ready') {
			pct = 100;
		}
		bootLabel.textContent = label;
		bootTrack.setAttribute('aria-valuenow', String(pct));
		bootTrack.setAttribute('aria-label', label);
		bootFill.style.width = pct + '%';
		// Pulse once the bytes are in and Safari is compiling wasm, and on the last beat.
		bootFill.classList.toggle('is-busy', (phase === 'load' && pct >= 100) || phase === 'ready');
		var shownCurrent = phase === 'ready' ? total : current;
		bootDetail.textContent = bootDetailText(shownCurrent, total);
	}

	function setStatusMode(mode) {
		if (!initializing && mode !== 'notice') {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		boot.style.display = mode === 'notice' ? 'none' : 'block';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		paintBoot('download', 0, knownTotalBytes());
		engine.startGame({
			// The completing chunk starts synchronous wasm compile inside Godot,
			// which blocks the next paint. Switch to 加载游戏 on an earlier
			// frame (last ~10%) so that label is already on screen through compile.
			'onProgress': function (current, total) {
				var known = knownTotalBytes();
				var tot = total > 0 ? total : known;
				var cur = current > 0 ? current : 0;
				if (bootPhase !== 'ready' && tot > 0 && cur >= tot * 0.9) {
					bootPhase = 'load';
				}
				if (bootPhase !== 'ready') {
					paintBoot(bootPhase, cur, tot);
				}
			},
		}).then(() => {
			bootPhase = 'ready';
			paintBoot('ready', knownTotalBytes(), knownTotalBytes());
			setTimeout(() => {
				setStatusMode('hidden');
			}, 280);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
